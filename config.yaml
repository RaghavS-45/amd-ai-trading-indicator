# config.yaml  –  single source of truth for all scripts
# Edit ONLY this file to change dates, seeds, or thresholds.

asset: AMD

# ── Date ranges ────────────────────────────────────────────────────
# ~2 years of data → more walk-forward folds, better generalisation
train_start: "2024-11-01"   # first NYSE trading day of 2023
train_end:   "2026-06-30"

# walk-forward validation window length (trading days)
val_window_days: 30
wf_min_train_days: 120          # first walk-forward fold trains on at least this many days
wf_gap_days: 1                 # trading days left out between train and validation

# final hold-out test  – touch only once in Phase 6
test_start: "2026-07-01"
test_end:   "2026-10-15"

# live dry-run dates  (fill in before Phase 8)
live_start: ""
live_end:   ""

# ── Context symbols (Phase 5) ──────────────────────────────────────
context_symbols: [SPY, QQQ, NVDA]

# ── Bar settings ───────────────────────────────────────────────────
bar_timeframe: "1Min"          # "1Min" or "5Min"
market_open:  "09:30"
market_close: "16:00"
drop_open_mins: 5              # drop first N minutes after open
min_day_coverage: 0.5

# ── Labeling ───────────────────────────────────────────────────────
horizon_bars: 10               # bars forward for the label
move_threshold: 0.0010         # |return| > threshold → Up/Down; else Neutral
                               # 10 bps: ~equal Up/Down/Neutral (EDA 2026-10-31); ~10x round-trip cost

# ── Feature lags ───────────────────────────────────────────────────
feature_sets: [base]           # base | context | intraday (Phase 5 experiments pass their own)
context_return_lags: [1, 5, 10, 30]
surprise_window: 20            # previous same-session bars for volume / trade-count surprise
return_lags: [1, 3, 5, 10, 30]
vol_window: 20
volume_ma_window: 20
rsi_period: 14
macd_fast: 12
macd_slow: 26
macd_signal: 9
bb_window: 20
bb_std: 2.0

# ── Model ──────────────────────────────────────────────────────────
random_seed: 42
lgbm_n_estimators: 500
lgbm_learning_rate: 0.05
lgbm_num_leaves: 31
min_signals_per_day: 5          # threshold search must keep at least this many signals/day
confidence_threshold: 0.55     # placeholder; tuned on validation in Phase 6

# ── Costs (paper trading simulation) ───────────────────────────────
fee_per_share: 0.005           # $0.005/share (slightly worse than reality)
slippage_per_share: 0.005      # $0.005/share assumed slippage
shares_per_trade: 10

# ── Paths ──────────────────────────────────────────────────────────
raw_data_path:     "data/amd_1min_raw.parquet"
grid_data_path:    "data/amd_1min_grid.parquet"   # complete minute grid
checksum_path:     "data/amd_1min_raw.sha256"
raw_data_template: "data/{sym}_1min_raw.parquet"   # per symbol, lower-case
checksum_template: "data/{sym}_1min_raw.sha256"
model_path:        "models/lgbm_model.pkl"
calibrated_model_path: "models/lgbm_calibrated.pkl"
signals_db_path:   "app/signals.db"
